<style>
  :root {
    --primary: #003A70;
    --secondary: #00A3E0;
    --bg-main: #F5F7FA;
    --card-bg: #FFFFFF;
    --text-dark: #1E293B;
    --text-muted: #64748B;
    --border: #E2E8F0;
    --amber-bg: #FEF3C7;
    --amber-border: #F59E0B;
    --amber-text: #92400E;
    --green-bg: #DCFCE7;
    --green-text: #166534;
    --red-bg: #FEE2E2;
    --red-text: #991B1B;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background-color: var(--bg-main); color: var(--text-dark); display: flex; height: 100vh; overflow: hidden; }

  .app-wrapper { display: flex; width: 100vw; height: 100vh; }

  .sidebar { width: 260px; background: var(--primary); color: #fff; display: flex; flex-direction: column; padding: 20px 0; }
  .brand { display: flex; align-items: center; gap: 12px; padding: 0 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .brand-logo { width: 40px; height: 40px; background: var(--secondary); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; }
  .brand-text h2 { font-size: 1.1rem; }
  .brand-text span { font-size: 0.75rem; opacity: 0.7; }

  .nav-menu { flex: 1; padding: 20px 0; }
  .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px 20px; color: rgba(255,255,255,0.8); text-decoration: none; font-size: 0.9rem; transition: 0.2s; }
  .nav-link:hover, .nav-link.active { background: rgba(255,255,255,0.1); color: #fff; border-left: 4px solid var(--secondary); }

  .user-profile { display: flex; align-items: center; gap: 12px; padding: 15px 20px; background: rgba(0,0,0,0.2); }
  .user-avatar { width: 36px; height: 36px; background: var(--secondary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
  .user-info { font-size: 0.8rem; }
  .user-role { opacity: 0.7; font-size: 0.75rem; }

  .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .top-bar { height: 60px; background: var(--card-bg); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; }
  .search-bar-global input { width: 350px; padding: 8px 14px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; }

  .content-container { flex: 1; overflow-y: auto; padding: 30px; }
  .view-panel { display: none; }
  .view-panel.active { display: block; }

  .page-header { margin-bottom: 25px; }
  .page-header h1 { font-size: 1.6rem; color: var(--primary); }
  .page-header p { font-size: 0.9rem; color: var(--text-muted); }

  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; margin-bottom: 25px; }
  .metric-card { background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border); border-left: 4px solid var(--primary); }
  .metric-card.amber { border-left-color: #F59E0B; }
  .metric-card.blue { border-left-color: var(--secondary); }
  .metric-card.warning { border-left-color: #D97706; }
  .metric-card.green { border-left-color: #10B981; }
  .metric-card.red { border-left-color: #EF4444; }
  .metric-val { font-size: 1.8rem; font-weight: bold; color: var(--primary); }
  .metric-lbl { font-size: 0.8rem; color: var(--text-muted); margin-top: 5px; }

  .dashboard-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
  .panel { background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border); }

  .data-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.85rem; }
  .data-table th, .data-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border); }
  .data-table th { background: #F8FAFC; color: var(--text-muted); font-weight: 600; }

  .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; background: #E2E8F0; }

  .warning-banner { padding: 15px 20px; border-radius: 8px; display: flex; gap: 15px; align-items: center; margin-bottom: 20px; }
  .warning-banner.style-amber { background: var(--amber-bg); border: 1px solid var(--amber-border); color: var(--amber-text); }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full-width { grid-column: span 2; }
  .form-group label { font-size: 0.85rem; font-weight: 600; }
  .form-group input, .form-group select, .form-group textarea { padding: 10px; border: 1px solid var(--border); border-radius: 6px; }

  .btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-secondary { background: #E2E8F0; color: var(--text-dark); }
  .btn-danger { background: #EF4444; color: #fff; }

  .ai-search-box { display: flex; gap: 10px; margin-bottom: 25px; }
  .ai-search-box input { flex: 1; padding: 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; }
  .ai-result-card { background: var(--card-bg); padding: 25px; border-radius: 8px; border: 1px solid var(--border); }
  .citations-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-top: 15px; }
  .citation-card { padding: 15px; border: 1px solid var(--border); border-radius: 6px; background: #F8FAFC; }

  .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
  .modal-content { background: #fff; padding: 30px; border-radius: 8px; width: 500px; display: flex; flex-direction: column; gap: 15px; }
</style>
