<div class="assigned-tasks-wrapper">
  <div class="page-header">
    <h1>My Assigned Tasks</h1>
    <p>View and manage all governance documents requiring your action, drafting, or approval.</p>
  </div>

  <div class="filter-bar" style="display:flex; gap:15px; margin-bottom:20px;">
    <select id="taskRoleFilter" onchange="applyTaskFilters()" style="padding:10px; border:1px solid var(--border); border-radius:6px;">
      <option value="">All My Assigned Roles</option>
      <option value="EDITOR">Assigned as Editor</option>
      <option value="OWNER">Assigned as Owner</option>
      <option value="APPROVER">Pending My Review/Approval</option>
    </select>
    <select id="taskStatusFilter" onchange="applyTaskFilters()" style="padding:10px; border:1px solid var(--border); border-radius:6px;">
      <option value="">All Statuses</option>
      <option value="DRAFT">DRAFT</option>
      <option value="SUBMITTED_LEVEL_1">SUBMITTED_LEVEL_1</option>
      <option value="SUBMITTED_LEVEL_2">SUBMITTED_LEVEL_2</option>
      <option value="PUBLISHED_PENDING_FINAL_APPROVAL">PUBLISHED_PENDING_FINAL_APPROVAL</option>
      <option value="REVISION_REQUESTED">REVISION_REQUESTED</option>
      <option value="FINAL_APPROVED">FINAL_APPROVED</option>
    </select>
  </div>

  <div class="table-container" style="background:#fff; padding:20px; border-radius:8px; border:1px solid var(--border);">
    <table class="data-table" id="assignedTasksTable">
      <thead>
        <tr>
          <th>Doc ID</th>
          <th>Title</th>
          <th>Department</th>
          <th>Type</th>
          <th>My Assignment</th>
          <th>Current Status</th>
          <th>Review Date</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>
