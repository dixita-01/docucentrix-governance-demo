<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocuCentrix | Enterprise Document Governance</title>
  <style>
    :root {
      --primary: #003A70;
      --primary-dark: #002850;
      --secondary: #0284c7;
      --bg-light: #f8fafc;
      --text-dark: #0f172a;
      --border-color: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; height: 100vh; background-color: var(--bg-light); color: var(--text-dark); overflow: hidden; }
    
    .sidebar { width: 250px; background-color: var(--primary); color: white; display: flex; flex-direction: column; justify-content: space-between; padding: 20px 0; }
    .brand { padding: 0 20px 20px; font-size: 1.3rem; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .brand span { font-size: 0.75rem; display: block; font-weight: normal; opacity: 0.7; }
    .nav-menu { list-style: none; margin-top: 15px; }
    .nav-item { padding: 12px 20px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 0.9rem; opacity: 0.8; transition: 0.2s; }
    .nav-item:hover, .nav-item.active { opacity: 1; background-color: var(--primary-dark); border-left: 4px solid var(--secondary); }
    .user-profile { padding: 15px 20px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 0.85rem; display: flex; align-items: center; gap: 10px; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; background-color: var(--secondary); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    
    .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .top-header { height: 60px; background-color: white; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; }
    .search-bar { width: 340px; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; outline: none; font-size: 0.85rem; }
    .header-actions { display: flex; align-items: center; gap: 20px; }
    .role-switcher { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-color); font-weight: bold; font-size: 0.85rem; }
    
    .notif-dropdown { display: none; position: absolute; right: 0; top: 40px; width: 340px; background: white; border: 1px solid var(--border-color); border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); z-index: 1000; padding: 12px; }
    .notif-item { padding: 10px; border-bottom: 1px solid #f1f5f9; cursor: pointer; border-radius: 4px; }
    .notif-item:hover { background-color: #f8fafc; }

    .content-body { flex: 1; padding: 25px; overflow-y: auto; }
    
    .metric-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; margin-bottom: 20px; }
    .metric-card { background: white; border-radius: 6px; padding: 15px; border: 1px solid var(--border-color); border-left: 4px solid #cbd5e1; }
    .metric-card.blue { border-left-color: #0284c7; }
    .metric-card.orange { border-left-color: #f59e0b; }
    .metric-card.green { border-left-color: #10b981; }
    .metric-card.red { border-left-color: #ef4444; }
    .metric-card h2 { font-size: 1.6rem; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
    .metric-card p { font-size: 0.75rem; color: #64748b; font-weight: 500; }

    .dashboard-split { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px; }
    .card { background: white; border-radius: 8px; padding: 20px; border: 1px solid var(--border-color); margin-bottom:15px; }
    
    .table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
    .table th, .table td { padding: 10px; text-align: left; border-bottom: 1px solid #f1f5f9; }
    .table th { background-color: #f8fafc; font-weight: 600; color: #475569; }
    
    .subnav-tabs { display: flex; gap: 10px; border-bottom: 2px solid #e2e8f0; margin-bottom: 15px; }
    .subnav-tab { padding: 8px 16px; cursor: pointer; font-weight: 600; font-size: 0.85rem; color: #64748b; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .subnav-tab.active { color: var(--secondary); border-bottom-color: var(--secondary); }

    .btn { padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
    .btn-primary { background-color: var(--secondary); color: white; }
    .btn-success { background-color: #16a34a; color: white; }
    .btn-danger { background-color: #dc2626; color: white; }
    .btn-secondary { background-color: #64748b; color: white; }
    .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center; }
    .modal-content { background: white; border-radius: 8px; padding: 25px; width: 480px; max-width: 90%; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div>
      <div class="brand">
        DocuCentrix
        <span>Your Enterprise Name</span>
      </div>
      <ul class="nav-menu" id="sideNavMenu"></ul>
    </div>
    <div class="user-profile">
      <div class="avatar" id="userAvatar">DC</div>
      <div>
        <div id="userName" style="font-weight: bold;">Loading...</div>
        <div id="userDeptRole" style="font-size: 0.75rem; opacity: 0.8;">...</div>
      </div>
    </div>
  </div>

  <div class="main-content">
    
    <div class="top-header">
      <input type="text" class="search-bar" placeholder="Quick search document ID, title, keyword...">
      
      <div class="header-actions">
        <div>
          <label style="font-size: 0.8rem; margin-right: 6px; color: #64748b;">Active Dept:</label>
          <select id="deptSelector" class="role-switcher" onchange="handleDeptSwitch(this.value)"></select>
        </div>
        <div>
          <label style="font-size: 0.8rem; margin-right: 6px; color: #64748b;">Active Role:</label>
          <select id="roleSelector" class="role-switcher" onchange="handleRoleSwitch(this.value)"></select>
        </div>

        <div style="position: relative;">
          <button onclick="toggleNotificationDropdown()" style="background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 6px;">
            <span style="font-size: 1.2rem;">🔔</span>
            <span style="font-weight: 600; color: #1e293b; font-size: 0.9rem;">Notifications</span>
            <span id="notifBadge" class="badge" style="background-color: var(--secondary); color: white;">0</span>
          </button>

          <div id="notificationDropdown" class="notif-dropdown">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 8px;">
              <strong style="color: #0f172a; font-size: 0.9rem;">Notifications</strong>
              <small style="color: #64748b; cursor: pointer;" onclick="toggleNotificationDropdown()">Close</small>
            </div>
            <div id="notificationListContainer" style="max-height: 260px; overflow-y: auto;">
              <p style="color: #64748b; font-size: 0.85rem; text-align: center; padding: 10px;">Loading notifications...</p>
            </div>
          </div>
        </div>

      </div>
    </div>

    <div class="content-body" id="appContentBody"></div>

  </div>

  <div id="rejectionModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 15px; color: #dc2626;">Request Update / Reject Draft</h3>
      <div style="margin-bottom: 12px;">
        <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom: 4px;">Section Name *</label>
        <input type="text" id="rejSection" class="search-bar" style="width:100%;" placeholder="e.g., Section 3.2 Security Controls">
      </div>
      <div style="margin-bottom: 12px;">
        <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom: 4px;">Rejection Reason *</label>
        <select id="rejReason" class="role-switcher" style="width:100%;">
          <option value="Non-Compliant Content">Non-Compliant Content</option>
          <option value="Formatting / Template Issue">Formatting / Template Issue</option>
          <option value="Incorrect SPOC Assignment">Incorrect SPOC Assignment</option>
        </select>
      </div>
      <div style="margin-bottom: 15px;">
        <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom: 4px;">Detailed Comments *</label>
        <textarea id="rejComments" style="width:100%; height: 80px; padding:8px; border:1px solid #cbd5e1; border-radius:6px;" placeholder="Specify required changes..."></textarea>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:10px;">
        <button class="btn btn-secondary" onclick="closeRejectionModal()">Cancel</button>
        <button class="btn btn-danger" onclick="submitRejectionForm()">Submit Rejection</button>
      </div>
    </div>
  </div>

  <div id="versionPreviewModal" class="modal">
    <div class="modal-content" style="width: 80%; max-width: 900px; height: 80vh; display: flex; flex-direction: column;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px; border-bottom:1px solid #cbd5e1; padding-bottom:10px;">
        <h3 id="versionModalTitle" style="color: #003A70;">Read-Only Version Preview</h3>
        <button class="btn btn-secondary" onclick="closeVersionPreviewModal()">Close Preview</button>
      </div>
      <div style="flex: 1; width: 100%; overflow: hidden; background: #f8fafc; border-radius: 6px;">
        <iframe id="versionPreviewIframe" src="" style="width:100%; height:100%; border:none;"></iframe>
      </div>
    </div>
  </div>

  <div id="finalApproverModal" class="modal">
    <div class="modal-content" style="width: 580px; max-width: 95%;">
      <h3 style="margin-bottom: 12px; color: #003A70;">Select Final Approver(s)</h3>
      
      <div style="margin-bottom: 12px;">
        <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:4px;">Final Approver Email(s) * (Comma-separated for multiple)</label>
        <input type="text" id="finalApproverEmailsInput" class="search-bar" style="width:100%;" placeholder="e.g. approver1@example.com, approver2@example.com" oninput="toggleFinalApprovalOptionsUI()">
      </div>

      <div id="multiApproverOptionsBox" style="display:none; background:#f8fafc; padding:12px; border-radius:6px; border:1px solid #e2e8f0; margin-bottom:12px;">
        <label style="display:block; font-size:0.85rem; font-weight:700; color:#003A70; margin-bottom:6px;">Approval Requirement</label>
        <div style="display:flex; gap:15px; font-size:0.85rem;">
          <label><input type="radio" name="appReqRule" value="ANY_ONE" checked onclick="toggleAdvancedStageBuilder(false)"> Any One Can Approve</label>
          <label><input type="radio" name="appReqRule" value="ALL_MUST" onclick="toggleAdvancedStageBuilder(false)"> All Selected Must Approve</label>
          <label><input type="radio" name="appReqRule" value="ADVANCED_STAGES" onclick="toggleAdvancedStageBuilder(true)"> Advanced Stages</label>
        </div>

        <div id="advancedStageBuilderBox" style="display:none; margin-top:12px; border-top:1px solid #cbd5e1; padding-top:10px;">
          <div id="advancedStagesContainer"></div>
          <button class="btn btn-secondary" style="font-size:0.75rem; margin-top:8px;" onclick="addAdvancedStageRow()">+ Add Stage</button>
        </div>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:15px;">
        <button class="btn btn-secondary" onclick="closeFinalApproverModal()">Cancel</button>
        <button class="btn btn-success" onclick="confirmFinalApproverSubmission()">Submit Approval</button>
      </div>
    </div>
  </div>

  <script>
    let currentUserState = null;
    let currentDocDetails = null;
    let currentRepoCategory = 'ALL';
    let activeApprovalDocId = null;
    let advancedStageCount = 0;
    let activeUserAssignmentList = [];

    function safeExecute(cb) {
      try { cb(); } catch(e) { console.error("Auto Bug Fix Caught Exception:", e); }
    }

    window.onload = function() { loadDashboard(); };

    function buildNavigation(role) {
      const menu = document.getElementById('sideNavMenu');
      let html = '';

      if (role === 'Admin') {
        html = `
          <li class="nav-item active" onclick="switchTab('dashboard')">📊 Dashboard</li>
          <li class="nav-item" onclick="switchTab('admin')">⚙️ Administration</li>
        `;
      } else if (role === 'Viewer') {
        html = `
          <li class="nav-item active" onclick="switchTab('dashboard')">📊 Dashboard</li>
          <li class="nav-item" onclick="switchTab('repository')">📁 Document Repository</li>
          <li class="nav-item" onclick="switchTab('ai')">🤖 Ask DocuCentrix AI</li>
        `;
      } else if (role === 'Team Lead' || role === 'Manager') {
        html = `
          <li class="nav-item active" onclick="switchTab('dashboard')">📊 Dashboard</li>
          <li class="nav-item" onclick="switchTab('initiate')">➕ Initiate Document</li>
          <li class="nav-item" onclick="switchTab('repository')">📁 Document Repository</li>
          <li class="nav-item" onclick="switchTab('tasks')">📋 Assigned Tasks</li>
          <li class="nav-item" onclick="switchTab('workflow')">🔄 Document Stage</li>
          <li class="nav-item" onclick="switchTab('admin')">⚙️ Administration</li>
          <li class="nav-item" onclick="switchTab('ai')">🤖 Ask DocuCentrix AI</li>
        `;
      } else {
        html = `
          <li class="nav-item active" onclick="switchTab('dashboard')">📊 Dashboard</li>
          <li class="nav-item" onclick="switchTab('repository')">📁 Document Repository</li>
          <li class="nav-item" onclick="switchTab('tasks')">📋 Assigned Tasks</li>
          <li class="nav-item" onclick="switchTab('workflow')">🔄 Document Stage</li>
          <li class="nav-item" onclick="switchTab('admin')">⚙️ Administration</li>
          <li class="nav-item" onclick="switchTab('ai')">🤖 Ask DocuCentrix AI</li>
        `;
      }
      menu.innerHTML = html;
    }

    function switchTab(tabName) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      if (event && event.currentTarget) event.currentTarget.classList.add('active');

      if (tabName === 'dashboard') loadDashboard();
      else if (tabName === 'initiate') loadInitiateDocumentForm();
      else if (tabName === 'repository') loadRepository();
      else if (tabName === 'tasks') loadAssignedTasks();
      else if (tabName === 'workflow') loadWorkflowOverview();
      else if (tabName === 'admin') loadAdminConsole();
      else if (tabName === 'ai') loadAiAssistant();
    }

    function loadDashboard() {
      google.script.run.withSuccessHandler(function(data) {
        safeExecute(function() {
          currentUserState = data.user || {};
          updateUserUI(data.user);
          buildNavigation(data.user.Role);

          document.getElementById('notifBadge').innerText = (data.notifications || []).length;

          const totalDocs = data.metrics.total || 1;
          const healthyPct = Math.round(((data.health.healthy || 0) / totalDocs) * 100);
          const attentionPct = Math.round(((data.health.attention || 0) / totalDocs) * 100);
          const actionReqPct = Math.round(((data.health.actionReq || 0) / totalDocs) * 100);

          let html = `
            <h2>Governance Dashboard</h2>
            <p style="color: #64748b; margin-bottom: 20px; font-size: 0.85rem;">Centralized document governance metrics, health analytics, and task control panel.</p>

            <div class="metric-grid">
              <div class="metric-card blue"><h2>${data.metrics.total}</h2><p>Total Documents</p></div>
              <div class="metric-card blue"><h2>${data.metrics.drafts}</h2><p>Draft Documents</p></div>
              <div class="metric-card orange"><h2>${data.metrics.pendingReviews}</h2><p>Pending Reviews</p></div>
              <div class="metric-card blue"><h2>${data.metrics.published}</h2><p>Published Documents</p></div>
              <div class="metric-card orange"><h2>${data.metrics.pendingFinal}</h2><p>Pending Final Approval</p></div>
              <div class="metric-card green"><h2>${data.metrics.fullyApproved}</h2><p>Fully Approved</p></div>
              <div class="metric-card red"><h2>${data.metrics.expired}</h2><p>Expired / Due Review</p></div>
            </div>

            <div class="dashboard-split">
              <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
                  <h3 style="color:#0f172a; font-size:1rem; margin:0;">Document Governance Health Breakdown</h3>
                  <span class="badge" style="background:#dcfce7; color:#166534; font-size:0.8rem; padding:4px 10px;">Overall Health: ${data.health.healthyPct}%</span>
                </div>
                
                <div style="width: 100%; background: #e2e8f0; height: 14px; border-radius: 7px; display:flex; overflow: hidden; margin-bottom: 20px;">
                  <div style="width: ${healthyPct}%; background: #10b981; height: 100%;" title="Healthy Docs: ${data.health.healthy}"></div>
                  <div style="width: ${attentionPct}%; background: #f59e0b; height: 100%;" title="Attention Needed: ${data.health.attention}"></div>
                  <div style="width: ${actionReqPct}%; background: #ef4444; height: 100%;" title="Action Required: ${data.health.actionReq}"></div>
                </div>

                <div style="width: 100%; display: flex; justify-content: space-around; text-align: center;">
                  <div style="flex: 1; text-align: center;">
                    <h2 style="color:#10b981; margin: 0 0 4px 0; font-size: 1.5rem; font-weight: 700;">${data.health.healthy || 0}</h2>
                    <p style="font-size:0.8rem; color:#64748b; margin: 0; white-space: nowrap;">Healthy Docs</p>
                  </div>
                  <div style="flex: 1; text-align: center;">
                    <h2 style="color:#f59e0b; margin: 0 0 4px 0; font-size: 1.5rem; font-weight: 700;">${data.health.attention || 0}</h2>
                    <p style="font-size:0.8rem; color:#64748b; margin: 0; white-space: nowrap;">Attention Needed</p>
                  </div>
                  <div style="flex: 1; text-align: center;">
                    <h2 style="color:#ef4444; margin: 0 0 4px 0; font-size: 1.5rem; font-weight: 700;">${data.health.actionReq || 0}</h2>
                    <p style="font-size:0.8rem; color:#64748b; margin: 0; white-space: nowrap;">Action Required</p>
                  </div>
                </div>
              </div>

              <div class="card">
                <h3 style="color:#0f172a; font-size:1rem; margin-bottom: 12px;">My Pending Notifications</h3>
                <div style="max-height:180px; overflow-y:auto;">
          `;

          if ((data.notifications || []).length === 0) {
            html += `<p style="color:#64748b; font-size:0.8rem; text-align:center;">No pending notifications.</p>`;
          } else {
            data.notifications.forEach(n => {
              html += `<div style="border-bottom:1px solid #f1f5f9; padding-bottom:8px; margin-bottom:8px;"><strong style="font-size:0.85rem; color:#0284c7;">{n.Message}</p></div>`;
            });
          }

          html += `</div></div></div>`;

          if (data.user.Role === 'Admin') {
            html += `
              <div class="card">
                <h3 style="color:#0f172a; font-size:1rem; margin-bottom: 10px;">Recent System Activity (Admin View)</h3>
                <table class="table">
                  <thead><tr><th>Doc ID</th><th>Action</th><th>User</th><th>Role</th><th>Date & Time</th></tr></thead>
                  <tbody>
            `;
            (data.recentActivity || []).forEach(a => {
              html += `<tr><td><strong>{a.Action}</span></td><td>{a.Role}</td><td><small>${a.Timestamp ? new Date(a.Timestamp).toLocaleString() : ''}</small></td></tr>`;
            });
            html += `</tbody></table></div>`;
          }

          document.getElementById('appContentBody').innerHTML = html;
        });
      }).getDashboardData();
    }

    function toggleNotificationDropdown() {
      const dropdown = document.getElementById('notificationDropdown');
      const isHidden = dropdown.style.display === 'none' || dropdown.style.display === '';
      dropdown.style.display = isHidden ? 'block' : 'none';

      if (isHidden) {
        google.script.run.withSuccessHandler(function(data) {
          const container = document.getElementById('notificationListContainer');
          const notifs = data.notifications || [];
          if (notifs.length === 0) {
            container.innerHTML = '<p style="color: #64748b; font-size: 0.85rem; text-align: center; padding: 10px;">No new notifications.</p>';
            return;
          }
          let html = '';
          notifs.forEach(n => {
            html += `
              <div class="notif-item" onclick="document.getElementById('notificationDropdown').style.display='none'; loadDocumentDetails('${n.LinkDocumentID}')">
                <div style="font-weight: 600; font-size: 0.85rem; color: #0284c7;">${n.Title || 'Alert'}</div>
                <div style="font-size: 0.8rem; color: #334155; margin-top: 2px;">${n.Message || ''}</div>
              </div>
            `;
          });
          container.innerHTML = html;
        }).getDashboardData();
      }
    }

    function updateUserUI(user) {
      if (!user) return;
      document.getElementById('userName').innerText = user.FullName || 'User';
      document.getElementById('userDeptRole').innerText = `{user.Role})`;
      
      const roleSelector = document.getElementById('roleSelector');
      const assignedRoles = user.AssignedRoles || [user.Role];
      
      let roleHtml = '';
      assignedRoles.forEach(r => {
        roleHtml += `<option value="${r}" {r}</option>`;
      });
      roleSelector.innerHTML = roleHtml;

      const deptSelector = document.getElementById('deptSelector');
      if (deptSelector) {
        let depts = ['HRO', 'Finance'];
        let deptHtml = '';
        if (!user.Department) {
          deptHtml += `<option value="" selected disabled>Unassigned</option>`;
        }
        depts.forEach(d => {
          deptHtml += `<option value="${d}" {d}</option>`;
        });
        deptSelector.innerHTML = deptHtml;
      }
    }

    function handleRoleSwitch(newRole) {
      google.script.run.withSuccessHandler(function() { loadDashboard(); }).switchActiveUserRole(newRole);
    }

    function handleDeptSwitch(newDept) {
      google.script.run.withSuccessHandler(function() { loadDashboard(); }).switchActiveUserDepartment(newDept);
    }

    function loadInitiateDocumentForm() {
      let html = `
        <h2>Initiate Governance Request</h2>
        <p style="color: #64748b; font-size: 0.85rem; margin-bottom: 15px;">Create a new Google Doc, Sheet, Slide Presentation, or upload an existing file.</p>
        
        <div class="card" style="max-width: 680px;">
          <form onsubmit="handleInitiateSubmit(event)">
            <div style="margin-bottom: 12px;">
              <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom: 4px;">Document Title *</label>
              <input type="text" id="initTitle" class="search-bar" style="width:100%;" required placeholder="e.g., Payroll Processing SOP / Treasury Tracker">
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 12px;">
              <div>
                <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom: 4px;">Department *</label>
                <select id="initDept" class="role-switcher" style="width:100%;" onchange="updateSubDeptDropdown(this.value)">
                  <option value="HRO">HRO</option>
                  <option value="Finance">Finance</option>
                </select>
              </div>
              <div>
                <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom: 4px;">Sub Department *</label>
                <select id="initSubDept" class="role-switcher" style="width:100%;"></select>
              </div>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 12px;">
              <div>

    function updateSubDeptDropdown(dept) {
      const subDeptSelect = document.getElementById('initSubDept');
      let options = [];

        options = ['Payroll', 'EDM'];

    function handleInitiateSubmit(e) {
      e.preventDefault();
      const formData = {
        title: document.getElementById('initTitle').value,
        department: document.getElementById('initDept').value,
        subDepartment: document.getElementById('initSubDept').value,
        documentType: document.getElementById('initType').value,
        targetFormat: document.getElementById('initFmt').value,
        classification: document.getElementById('initClass').value,
        editorEmail: document.getElementById('initEditor').value,
        coEditors: document.getElementById('initCoEditors').value,
        effectiveDate: document.getElementById('initEffectiveDate').value,
        reviewFrequency: document.getElementById('initReviewFreq').value
      };

      const fileInput = document.getElementById('initFileInput');
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.onload = function(evt) {
          google.script.run.withSuccessHandler(function(res) {
            alert("Document request initiated successfully! ID: " + res.documentId);
            switchTab('repository');
          }).withFailureHandler(function(err) {
            alert(err.message);
          }).createDocumentRequest(formData, evt.target.result, file.name, file.type);
        };
        reader.readAsDataURL(file);
      } else {
        google.script.run.withSuccessHandler(function(res) {
          alert("Document workspace created successfully! ID: " + res.documentId);
          switchTab('repository');
        }).withFailureHandler(function(err) {
          alert(err.message);
        }).createDocumentRequest(formData, null, null, null);
      }
    }

            </p>

              <div style="display:flex; gap:10px; align-items:center; background:#f8fafc; padding:12px; border-radius:6px; margin-bottom:15px;">

              <table class="table">
                <thead><tr><th>Version Number</th><th>Created By</th><th>Creation Date</th><th>Approval Status</th><th>Change Summary</th><th>View Version</th></tr></thead>

          html += `</tbody></table></div></div>`;

          html += `
            <div id="commentsTab" class="docSubTabContent card" style="display:none;">
              <h3>In-App Document Comments & Feedback</h3>
              
              <div style="margin-bottom: 20px; background: #f8fafc; padding: 15px; border-radius: 6px; border: 1px solid #e2e8f0;">
                <h4 style="margin-bottom: 10px; font-size: 0.9rem; color: #003A70;">Add Comment</h4>
                <div style="margin-bottom: 10px;">
                  <label style="display:block; font-size:0.8rem; font-weight:600; margin-bottom:4px;">Section Name / Page Reference</label>
                  <input type="text" id="newCommentSection" class="search-bar" style="width:100%;" placeholder="e.g., Section 2.1 or General Feedback">
                </div>
                <div style="margin-bottom: 10px;">
                  <label style="display:block; font-size:0.8rem; font-weight:600; margin-bottom:4px;">Your Comment *</label>

            html += `<tr><td><small>{c.VersionNumber}</td><td><strong>{c.UserEmail}</td><td>${c.CommentText}</td></tr>`;

          html += `</tbody></table></div>`;

          document.getElementById('appContentBody').innerHTML = html;

          const selB = document.getElementById('verSelectB');
          if (selA && selB) {
            selA.innerHTML = verOptionsHtml;
            selB.innerHTML = verOptionsHtml;
          }
        });
      })
      .withFailureHandler(function(err) {
        alert("Error opening document details: " + err.message);
      })
      .getDocumentDetails(docId);
    }

    function switchDocSubTab(tabId, el) {
      document.querySelectorAll('.docSubTabContent').forEach(t => t.style.display = 'none');
      document.querySelectorAll('.subnav-tab').forEach(t => t.classList.remove('active'));
      document.getElementById(tabId).style.display = 'block';
      el.classList.add('active');
    }

    function submitInAppComment(docId) {
      const sec = document.getElementById('newCommentSection').value;
      const text = document.getElementById('newCommentText').value;

      if (!text || text.trim() === '') {
        alert("Please enter a comment before submitting.");
        return;
      }

      google.script.run.withSuccessHandler(function() {
        alert("Comment added successfully.");
        loadDocumentDetails(docId);
      }).withFailureHandler(function(err) {
        alert("Failed to submit comment: " + err.message);
      }).addDocumentComment(docId, sec, text);
    }

    function openVersionPreviewModal(versionNumber, previewUrl) {
      if (!previewUrl || previewUrl === '#') {
        alert(`Read-only preview is unavailable for Version ${versionNumber}.`);
        return;
      }
      
      const modal = document.getElementById('versionPreviewModal');
      const iframe = document.getElementById('versionPreviewIframe');
      const title = document.getElementById('versionModalTitle');
      
      if (modal && iframe && title) {
        title.innerText = `Read-Only Preview - Version ${versionNumber}`;
        iframe.src = previewUrl;
        modal.style.display = 'flex';
      } else {
        window.open(previewUrl, '_blank');
      }

      const modal = document.getElementById('versionPreviewModal');
      const iframe = document.getElementById('versionPreviewIframe');
      if (modal && iframe) {
        iframe.src = '';
        modal.style.display = 'none';
      }

      advancedStageCount++;

      stageDiv.className = 'stage-row';
      stageDiv.style.cssText = 'background:#fff; padding:8px; border:1px solid #cbd5e1; border-radius:4px; margin-bottom:8px;';

    function confirmFinalApproverSubmission() {
      const emails = document.getElementById('finalApproverEmailsInput').value;
      if (!emails || emails.trim() === '') {
        alert("Please enter at least one Final Approver email.");
        return;
      }

      const emailList = emails.split(',').filter(e => e.trim() !== '');
      let appType = 'SINGLE';
      let config = [];

      if (emailList.length > 1) {
        const selectedRule = document.querySelector('input[name="appReqRule"]:checked').value;
        appType = selectedRule;

        if (appType === 'ADVANCED_STAGES') {
          for (let i = 1; i <= advancedStageCount; i++) {
            const rule = document.querySelector(`input[name="stageRule_${i}"]:checked`).value;
            const appVals = document.getElementById(`stageApprovers_${i}`).value;
            if (appVals && appVals.trim() !== '') {
              config.push({
                stage: i,
                rule: rule,
                approvers: appVals.split(',').map(e => e.trim())
              });
            }
          }
        }
      }

      closeFinalApproverModal();
      google.script.run.withSuccessHandler(function() {
        alert("Approval granted.");
        loadDocumentDetails(activeApprovalDocId);
      }).processWorkflowApproval(activeApprovalDocId, 'APPROVE', '', '', '', emails, appType, config);
    }

        <h2>Administration Console</h2>
        <div class="subnav-tabs" style="margin-top:15px; margin-bottom:15px;">
          <div class="subnav-tab active" onclick="switchAdminTab('assignTab', this)">Assign User Access</div>
          <div class="subnav-tab" onclick="switchAdminTab('revokeDocTab', this)">Revoke Document Access</div>
          <div class="subnav-tab" onclick="switchAdminTab('revokeUserTab', this)">Revoke User Access</div>
        </div>

        <div id="assignTab" class="adminSubTab card">
          <h3>User Role Assignment</h3>
          <form onsubmit="handleUserAssignment(event)" style="margin-top:10px; max-width:500px;">
            <div style="margin-bottom:10px;">
              <label style="display:block; font-size:0.8rem; font-weight:600; margin-bottom:4px;">User Email *</label>
              <input type="email" id="assignEmail" class="search-bar" style="width:100%;" required placeholder="user@example.com">
            </div>
            <div style="margin-bottom:10px;">
              <label style="display:block; font-size:0.8rem; font-weight:600; margin-bottom:4px;">Role *</label>
              <select id="assignRole" class="role-switcher" style="width:100%;">
                ${roleOptions}
              </select>
            </div>
            <div style="margin-bottom:10px;">
              <label style="display:block; font-size:0.8rem; font-weight:600; margin-bottom:4px;">Department *</label>
              <select id="assignDept" class="role-switcher" style="width:100%;" onchange="updateAdminSubDeptDropdown(this.value)">
                <option value="HRO">HRO</option>
                <option value="Finance">Finance</option>
              </select>
            </div>
            <div style="margin-bottom:15px;">
              <label style="display:block; font-size:0.8rem; font-weight:600; margin-bottom:4px;">Sub Department</label>
              <select id="assignAdminSubDept" class="role-switcher" style="width:100%;"></select>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Assign Hierarchy</button>
          </form>
        </div>

        <div id="revokeDocTab" class="adminSubTab card" style="display:none;">
          <h3>Revoke Specific Document Access</h3>
          <form onsubmit="handleRevokeDocAccessSubmit(event)" style="margin-top:10px; max-width:500px;">
            <div style="margin-bottom:10px;">
              <label style="display:block; font-size:0.8rem; font-weight:600; margin-bottom:4px;">Target Document ID *</label>
              <input type="text" id="revokeDocId" class="search-bar" style="width:100%;" required placeholder="e.g., DOC-837192">
            </div>
            <div style="margin-bottom:15px;">
              <label style="display:block; font-size:0.8rem; font-weight:600; margin-bottom:4px;">SPOC User Email *</label>
              <input type="email" id="revokeSpocEmail" class="search-bar" style="width:100%;" required placeholder="spoc@example.com">
            </div>
            <button type="submit" class="btn btn-danger" style="width:100%;">🚫 Revoke Document Access</button>
          </form>
        </div>

        <div id="revokeUserTab" class="adminSubTab card" style="display:none;">
          <h3 style="color:#dc2626;">Revoke User Access</h3>
          <p style="font-size:0.8rem; color:#64748b; margin-bottom:12px;">Revoke specific organizational roles, departments, and sub-department assignments from an employee.</p>
          
          <form onsubmit="handleRevokeUserAccessSubmit(event)" style="margin-top:10px; max-width:500px;">
            <div style="margin-bottom:10px;">
              <label style="display:block; font-size:0.8rem; font-weight:600; margin-bottom:4px;">Employee Email ID *</label>
              <input type="email" id="revokeUserEmail" class="search-bar" style="width:100%;" required placeholder="employee@example.com" onchange="fetchAndPopulateUserAssignments(this.value)" onblur="fetchAndPopulateUserAssignments(this.value)">
            </div>

            <div style="margin-bottom:10px;">
              <label style="display:block; font-size:0.8rem; font-weight:600; margin-bottom:4px;">Role *</label>
              <select id="revokeRoleSelect" class="role-switcher" style="width:100%; border-color:#fca5a5;" required onchange="updateRevokeDeptOptions()">
                <option value="" disabled selected>Enter Employee Email first...</option>
              </select>
            </div>

            <div style="margin-bottom:10px;">
              <label style="display:block; font-size:0.8rem; font-weight:600; margin-bottom:4px;">Department *</label>
              <select id="revokeDeptSelect" class="role-switcher" style="width:100%; border-color:#fca5a5;" required onchange="updateRevokeSubDeptOptions()">
                <option value="" disabled selected>Select Role first...</option>
              </select>
            </div>

            <div style="margin-bottom:10px;">
              <label style="display:block; font-size:0.8rem; font-weight:600; margin-bottom:4px;">Sub Department</label>
              <select id="revokeSubDeptSelect" class="role-switcher" style="width:100%; border-color:#fca5a5;">
                <option value="" disabled selected>Select Department first...</option>
              </select>
            </div>

            <div style="margin-bottom:15px;">
              <label style="display:block; font-size:0.8rem; font-weight:600; margin-bottom:4px;">Reason for Revocation *</label>
              <textarea id="revokeReason" style="width:100%; height:70px; padding:8px; border:1px solid #cbd5e1; border-radius:6px;" required placeholder="Specify organizational reason for revoking this assignment..."></textarea>
            </div>

            <button type="submit" class="btn btn-danger" style="width:100%; background-color:#dc2626; color:white;">🚫 Revoke User Access</button>
          </form>
        </div>
      `;
      document.getElementById('appContentBody').innerHTML = html;
      updateAdminSubDeptDropdown('HRO');
    }

    function switchAdminTab(tabId, el) {
      document.querySelectorAll('.adminSubTab').forEach(t => t.style.display = 'none');
      document.querySelectorAll('.subnav-tab').forEach(t => t.classList.remove('active'));
      document.getElementById(tabId).style.display = 'block';
      el.classList.add('active');
    }

    function fetchAndPopulateUserAssignments(email) {
      if (!email || email.trim() === '') return;

      const roleSel = document.getElementById('revokeRoleSelect');
      roleSel.innerHTML = `<option value="" disabled selected>Loading active assignments...</option>`;

      google.script.run.withSuccessHandler(function(res) {
        if (!res.success || !res.assignments || res.assignments.length === 0) {
          alert(`No active organizational assignments found for employee ${email}.`);
          roleSel.innerHTML = `<option value="" disabled selected>No active assignments found</option>`;
          document.getElementById('revokeDeptSelect').innerHTML = `<option value="" disabled selected>No active assignments</option>`;
          document.getElementById('revokeSubDeptSelect').innerHTML = `<option value="" disabled selected>No active assignments</option>`;
          activeUserAssignmentList = [];
          return;
        }

        activeUserAssignmentList = res.assignments;
        updateRevokeRoleOptions();
      }).withFailureHandler(function(err) {
        alert("Error fetching user assignments: " + err.message);
      }).getUserAssignments(email);
    }

    function updateRevokeRoleOptions() {
      const roleSel = document.getElementById('revokeRoleSelect');
      if (!roleSel) return;

      const roles = Array.from(new Set(activeUserAssignmentList.map(a => a.role)));
      let html = `<option value="" disabled ${roles.length > 1 ? 'selected' : ''}>-- Select Assigned Role --</option>`;
      
      roles.forEach(r => {
        html += `<option value="{r}</option>`;
      });

      roleSel.innerHTML = html;

      if (roles.length === 1) {
        roleSel.value = roles[0];
      }

      updateRevokeDeptOptions();
    }

    function updateRevokeDeptOptions() {
      const roleVal = document.getElementById('revokeRoleSelect').value;
      const deptSel = document.getElementById('revokeDeptSelect');
      if (!deptSel) return;

      if (!roleVal) {
        deptSel.innerHTML = `<option value="" disabled selected>Select Role first...</option>`;
        return;
      }

      const matchingDepts = Array.from(new Set(
        activeUserAssignmentList
          .filter(a => a.role === roleVal)
          .map(a => a.department)
      ));

      let html = `<option value="" disabled ${matchingDepts.length > 1 ? 'selected' : ''}>-- Select Assigned Department --</option>`;
      matchingDepts.forEach(d => {
        html += `<option value="{d}</option>`;
      });

      deptSel.innerHTML = html;

      if (matchingDepts.length === 1) {
        deptSel.value = matchingDepts[0];
      }

      updateRevokeSubDeptOptions();
    }

    function updateRevokeSubDeptOptions() {
      const roleVal = document.getElementById('revokeRoleSelect').value;
      const deptVal = document.getElementById('revokeDeptSelect').value;
      const subDeptSel = document.getElementById('revokeSubDeptSelect');
      if (!subDeptSel) return;

      if (!roleVal || !deptVal) {
        subDeptSel.innerHTML = `<option value="" disabled selected>Select Department first...</option>`;
        return;
      }

      const matchingSubDepts = Array.from(new Set(
        activeUserAssignmentList
          .filter(a => a.role === roleVal && a.department === deptVal)
          .map(a => a.subDepartment)
      ));

      let html = `<option value="" disabled ${matchingSubDepts.length > 1 ? 'selected' : ''}>-- Select Assigned Sub Department --</option>`;
      matchingSubDepts.forEach(sd => {
        html += `<option value="{sd}</option>`;
      });

      subDeptSel.innerHTML = html;

      if (matchingSubDepts.length === 1) {
        subDeptSel.value = matchingSubDepts[0];
      }
    }

    function updateAdminSubDeptDropdown(dept) {
      const subDeptSelect = document.getElementById('assignAdminSubDept');
      const roleSelect = document.getElementById('assignRole');
      if (!subDeptSelect) return;

      if (roleSelect && roleSelect.value === 'Manager') {
        subDeptSelect.innerHTML = `<option value="ALL">All Sub-Departments (Optional)</option>`;
        subDeptSelect.disabled = true;
        return;
      }

      subDeptSelect.disabled = false;
      let options = [];
      if (dept === 'HRO') {
        options = ['Payroll', 'EDM'];
      } else if (dept === 'Finance') {
        options = ['Order To Cash', 'Treasury', 'Record to Report', 'Record to Pay'];
      }
      
      let html = '';
      options.forEach(s => {
        html += `<option value="{s}</option>`;
      });
      subDeptSelect.innerHTML = html;
    }

    function handleUserAssignment(e) {
      e.preventDefault();
      const email = document.getElementById('assignEmail').value;
      const role = document.getElementById('assignRole').value;
      const dept = document.getElementById('assignDept').value;
      const subDept = document.getElementById('assignAdminSubDept').value;

      google.script.run.withSuccessHandler(function() {
        alert(`Role hierarchy assigned successfully for ${email} under ${dept} -> ${subDept}.`);
      }).assignUserHierarchy(email, role, dept, subDept, 'General');
    }

    function handleRevokeDocAccessSubmit(e) {
      e.preventDefault();
      const docId = document.getElementById('revokeDocId').value;
      const email = document.getElementById('revokeSpocEmail').value;

      google.script.run.withSuccessHandler(function(res) {
        alert(`Specific document access (${res.revokedRoles.join(', ')}) revoked successfully for ${email} on document ${docId}.`);
        document.getElementById('revokeDocId').value = '';
        document.getElementById('revokeSpocEmail').value = '';
      }).withFailureHandler(function(err) {
        alert("Revocation failed: " + err.message);
      }).revokeSpecificUserDocAccess(docId, email);
    }

    function handleRevokeUserAccessSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('revokeUserEmail').value;
      const role = document.getElementById('revokeRoleSelect').value;
      const dept = document.getElementById('revokeDeptSelect').value;
      const subDept = document.getElementById('revokeSubDeptSelect').value;
      const reason = document.getElementById('revokeReason').value;

      if (!email || !role || !dept || !reason) {
        alert("Mandatory fields missing. Please ensure Email, Role, Department, and Reason are specified.");
        return;
      }

      if (!confirm(`Confirm revocation of assignment (${role} | ${dept} | ${subDept || 'N/A'}) for ${email}?`)) {
        return;
      }

      google.script.run.withSuccessHandler(function(res) {
        alert(`Assignment (${role} | ${dept} | ${subDept || 'N/A'}) successfully revoked for ${email}. Remaining assignments remain active.`);
        document.getElementById('revokeUserEmail').value = '';
        document.getElementById('revokeReason').value = '';
        document.getElementById('revokeRoleSelect').innerHTML = `<option value="" disabled selected>Enter Employee Email first...</option>`;
        document.getElementById('revokeDeptSelect').innerHTML = `<option value="" disabled selected>Select Role first...</option>`;
        document.getElementById('revokeSubDeptSelect').innerHTML = `<option value="" disabled selected>Select Department first...</option>`;
        activeUserAssignmentList = [];
      }).withFailureHandler(function(err) {
        alert("Revocation failed: " + err.message);
      }).revokeUserAccess(email, role, dept, subDept, reason);
    }

    function loadAssignedTasks() {
      google.script.run.withSuccessHandler(function(tasks) {
        let html = `<h2>My Assigned Tasks</h2><div class="card"><table class="table"><thead><tr><th>Doc ID</th><th>Title</th><th>Department</th><th>Status</th><th>Action</th></tr></thead><tbody>`;
        if (tasks.length === 0) {
          html += `<tr><td colspan="5" style="text-align:center; color:#64748b;">No active tasks assigned to your active role.</td></tr>`;
        } else {
          tasks.forEach(t => {
            html += `<tr><td><strong>{t.Title}</td><td>{t.Status}</td><td><button class="btn btn-primary" onclick="loadDocumentDetails('${t.DocumentID}')">Open Task</button></td></tr>`;
          });
        }
        html += `</tbody></table></div>`;
        document.getElementById('appContentBody').innerHTML = html;
      }).getUserAssignedTasks();
    }

    function loadWorkflowOverview() {
      google.script.run.withSuccessHandler(function(list) {
        let html = `<h2>Approval Workflow Stage Tracker</h2><div class="card"><table class="table"><thead><tr><th>Doc ID</th><th>Title</th><th>Department</th><th>Current Stage</th><th>Editor</th></tr></thead><tbody>`;
        list.forEach(w => {
          html += `<tr><td><strong>{w.Title}</td><td>{w.CurrentStage}</td><td>${w.Editor}</td></tr>`;
        });
        html += `</tbody></table></div>`;
        document.getElementById('appContentBody').innerHTML = html;
      }).getWorkflowStatusOverview();
    }

    function loadAiAssistant() {
      document.getElementById('appContentBody').innerHTML = `<h2>Ask DocuCentrix AI</h2><p style="color:#64748b; font-size:0.85rem;">Gemini Pro intelligence scanning only verified SOP documents.</p>`;
    }
  </script>
</body>
</html>
